<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayni 固件更新</title>
<style>body{margin:32px auto;padding:0 20px;max-width:640px;background:#0c131c;color:#e7edf5;font:16px system-ui;line-height:1.7}a{color:#73d4bb}button,input{font:inherit;margin:12px 0}button{padding:10px 20px}progress{width:100%}#status{white-space:pre-wrap}</style>
<main><h1>固件更新</h1><a href="/">设备设置</a> · <a href="/logs">实时日志</a>
<p id="version">正在读取版本…</p><p>先结束或取消当前对话，断开电机驱动电源。选择该实验的应用固件 .bin，更新期间保持供电。Wi-Fi、遥控器配对和会话数据会保留。</p>
<form id="form"><input id="file" type="file" accept=".bin" required><br><button id="send" disabled>上传并更新</button></form>
<progress id="progress" value="0" max="100"></progress><p id="status" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);let maximum=0;
async function info(){const r=await fetch('/api/firmware',{cache:'no-store'});if(!r.ok)throw Error('无法读取固件状态');const v=await r.json();maximum=v.max_bytes;$('version').textContent=`当前版本：${v.version}；启动槽：${v.running}${v.pending_verify?'；正在确认启动状态':''}；应用上限：${maximum} 字节`;$('send').disabled=!v.ota_enabled||v.pending_verify;return v;}
async function reconnect(){for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));try{const v=await info();if(!v.pending_verify){$('status').textContent+='\n设备已重新连接。请核对当前版本、启动槽和日志。';return;}}catch{}}$('status').textContent+='\n设备尚未重新连接，请稍后刷新或查看触屏。';}
$('form').onsubmit=e=>{e.preventDefault();const f=$('file').files[0];if(!f||f.size>maximum||f.size===0){$('status').textContent='文件为空或超过应用上限。';return;}$('send').disabled=true;const x=new XMLHttpRequest();x.open('POST','/api/firmware');x.setRequestHeader('Content-Type','application/octet-stream');x.timeout=240000;
x.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100;$('status').textContent='正在上传；上传完成后设备还需校验并重启。';};
x.onload=()=>{if(x.status===200){$('status').textContent='固件已校验，正在重启并确认启动状态…';reconnect();}else if(x.status===409||x.status===400){$('status').textContent='更新未开始：'+x.responseText;info().catch(()=>{});}else{$('status').textContent='更新未确认，请核对版本和日志；不会自动重传。';reconnect();}};
x.onerror=x.ontimeout=()=>{$('status').textContent='连接中断，更新结果未知。正在读取设备状态；不会自动重传。';reconnect();};x.send(f);};
info().catch(e=>$('status').textContent=e.message);
</script></html>

name: ci

# Ordinary code PRs run checks and ASan/UBSan in one tool container.
# Extra native configurations (one job each) and ESP-IDF run only
# periodically or via ci:full/manual on separate hosted runners.
# Weekly/manual runs cover every configuration; main pushes run checks only.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group so that a push to main does not cancel the
# weekly full run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The wrapper and commands are written for bash (also inside ESP-IDF).
defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  # ESP-IDF steps run as root; its work directory belongs to the runner user,
  # so Git would treat the checkout as unsafe and not find the repository.
  # Checkout trusts it only for its own commands.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
  # Standard public Ubuntu runners have four vCPUs. Keep build and test
  # parallelism bounded even on cold runners.
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  IDF_PY_BUILD_JOBS: 4

jobs:
  checks:
    name: checks and ASan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      native_presets: ${{ steps.scope.outputs.native_presets }}
      esp_idf: ${{ steps.scope.outputs.esp_idf }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the complete PR merge result with its base, not its last commit.
          fetch-depth: 2
          persist-credentials: false
      - name: Runner resources
        run: |
          echo "CPUs: $(nproc)"
          grep -E 'MemTotal|MemAvailable|SwapTotal' /proc/meminfo
          df -h "$GITHUB_WORKSPACE"
          cat /proc/pressure/memory
          docker ps --format '{{.Names}} {{.Status}}'
      - name: Prepare cached native tools
        run: tools/ci/run_tools.sh prepare
      - name: Select daily or full validation
        id: scope
        env:
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          args=("$GITHUB_EVENT_NAME")
          if [ "$CI_FULL" = true ]; then args+=(--full); fi
          selection=$(tools/ci/run_tools.sh run python3 tools/ci/select_checks.py "${args[@]}")
          printf '%s\n' "$selection" | tee -a "$GITHUB_OUTPUT"
      - name: Checks and complete ASan suite
        env:
          RUN_ASAN: ${{ steps.scope.outputs.asan }}
        run: tools/ci/run_tools.sh run bash tools/ci/checks.sh "$RUN_ASAN"

  # One hosted job per configuration.
  native:
    name: periodic or requested native configurations
    needs: checks
    if: needs.checks.outputs.native_presets != '[]'
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.checks.outputs.native_presets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare cached native tools
        run: tools/ci/run_tools.sh prepare
      - name: Configure ASLR for ThreadSanitizer on the hosted runner
        if: matrix.preset == 'native-tsan'
        run: |
          bits=$(tools/ci/run_tools.sh mmap-bits)
          if [ "$bits" -gt 28 ]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
            bits=$(tools/ci/run_tools.sh mmap-bits)
          fi
          if [ "$bits" -gt 28 ]; then
            echo "::error::vm.mmap_rnd_bits is $bits; ThreadSanitizer needs 28"
            exit 1
          fi
      - name: Complete suite
        env:
          PRESET: ${{ matrix.preset }}
        run: tools/ci/run_tools.sh run bash tools/ci/native.sh "$PRESET"

  clang-tidy:
    name: clang-tidy (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare cached native tools
        run: tools/ci/run_tools.sh prepare
      # Without the precompiled header, so that this weekly build also checks
      # that each test file includes what it uses.
      - name: Configure
        run: tools/ci/run_tools.sh run cmake --preset native-debug -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DAYNI_DOWNLOAD_DIR=/downloads
      - name: Build generated sources
        run: tools/ci/run_tools.sh run cmake --build --preset native-debug
      - name: clang-tidy
        run: tools/ci/run_tools.sh run run-clang-tidy-18 -j "$CMAKE_BUILD_PARALLEL_LEVEL" -p build/native -quiet 'core/|hosts/|runtime/|targets/'

  esp-idf:
    name: ESP32-S3 independent normal program (ESP-IDF v6.0.3)
    needs: checks
    if: needs.checks.outputs.esp_idf == 'true'
    runs-on: ubuntu-24.04
    # Each hosted runner starts fresh; allow for the firmware image pull.
    timeout-minutes: 40
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
    # Its own cache volume: the image's ccache is a different version from
    # Ubuntu's, and the firmware needs a smaller limit.
    container:
      image: espressif/idf:v6.0.3
      options: --cpus 4 --memory 3g --memory-swap 3g
      volumes:
        - ayni-ccache-esp-idf:/ccache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # Every compile passes a specs file that each build writes anew, and
          # ccache hashes its modification time unless told to hash content.
          export CCACHE_DIR=/ccache CCACHE_MAXSIZE=200M CCACHE_COMPILERCHECK=content
          ccache --zero-stats
          python3 tests/portability/build_esp.py --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/ayni-independent-esp" --source-revision "$(git rev-parse HEAD)"
          ccache --show-stats
      - name: Check LittleFS file adapter on an emulated normal medium
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S tests/portability/esp_files -B build/esp-files \
            -DAYNI_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DLITTLEFS_COMPONENT_DIR="$RUNNER_TEMP/ayni-independent-esp/consumer/esp32_s3/managed_components/joltwallet__littlefs"
          cmake --build build/esp-files
          ctest --test-dir build/esp-files --output-on-failure
      - name: Return files to the runner's user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP/..")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME"

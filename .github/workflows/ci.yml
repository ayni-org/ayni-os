name: ci

# Every job is billed in whole minutes, so CI runs the full matrix only where
# it can find something new:
# - ready pull requests that change more than Markdown files (a draft runs
#   nothing until it is marked ready);
# - every Monday 02:00 Beijing time on main, which also refreshes the compiler
#   caches that pull requests start from;
# - on demand (workflow_dispatch).
# A push to main runs the checks job only: the pull request already built and
# tested the same merge result.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group so that a push to main does not cancel the
# weekly full run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: dependency, contract, readability and format checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its first parent, the base.
          fetch-depth: 2
      # First, so that the builds still run when a later check fails.
      - name: Decide whether to build
        id: scope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Not piped into grep -q: under pipefail, git dying of SIGPIPE
              # after an early match would read as "no code changed".
              changed=$(git diff --name-only HEAD^1 HEAD)
              if [ -n "$changed" ] && grep -qv '\.md$' <<< "$changed"; then
                build=true
              else
                build=false
              fi ;;
            push) build=false ;;
            *) build=true ;;
          esac
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Dependency rules
        run: python3 tools/check_deps.py
      - name: Dependency checker tests
        run: python3 -m unittest -v test_check_deps
        working-directory: tests/tools
      - name: Contract clauses and traceability
        run: python3 tools/check_contracts.py
      - name: Contract checker tests
        run: python3 -m unittest -v test_check_contracts
        working-directory: tests/tools
      - name: Readability rules and baseline
        run: python3 tools/check_readability.py
      - name: Readability checker tests
        run: python3 -m unittest -v test_check_readability
        working-directory: tests/tools
      - name: Formatting
        run: git ls-files '*.c' '*.cpp' '*.h' | xargs clang-format-18 --dry-run --Werror
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  native:
    name: native ${{ matrix.compiler }} ${{ matrix.preset }}
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-debug}
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-release}
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-asan}
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-tsan}
          - {compiler: clang, cc: clang, cxx: clang++, preset: native-debug}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # ccache keeps compiler output between runs. -g output records the build
      # directory, and the workspace path is the same on every runner, so
      # debug builds hit as well.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      # Runners for private repositories have two vCPUs. On two CPUs, two test
      # processes halved the sanitizer test time and four were no faster.
      CTEST_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build ccache
      # Every run saves a new entry and starts from the newest one for its
      # compiler and preset. Pull requests also restore the entries that the
      # weekly run saves on main.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-
      # GCC 13's ThreadSanitizer may fail to start with 32 bits of mmap
      # randomization, which some runner kernels default to.
      - name: Limit ASLR for ThreadSanitizer
        if: matrix.preset == 'native-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Tool versions
        run: cmake --version && ninja --version && ccache --version && "$CC" --version && "$CXX" --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        run: ccache --show-stats
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Simulator
        run: ./build/${{ matrix.preset == 'native-debug' && 'native' || matrix.preset }}/targets/simulator/ayni-sim

  clang-tidy:
    name: clang-tidy (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-tidy-18
      - name: Configure
        run: cmake --preset native-debug
      - name: Build generated sources
        run: cmake --build --preset native-debug
      - name: clang-tidy
        run: run-clang-tidy-18 -p build/native -quiet 'core/|hosts/|runtime/|targets/'

  esp-idf:
    name: ESP32-S3 hello firmware (ESP-IDF v6.0.3)
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd targets/esp32_assistant
          idf.py build
          idf.py size

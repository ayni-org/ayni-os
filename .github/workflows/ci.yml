name: ci

# Every job runs on the self-hosted runner, a machine kept for CI. Builds
# and checks use containers: native tools come from Ubuntu 24.04 (GCC 13,
# Clang 18, the versions docs/development.md pins) whatever the host runs,
# and the firmware uses the ESP-IDF image. The machine is not billed, but it
# runs one job at a time, so CI runs the full matrix only where it can find
# something new:
# - ready pull requests that change more than Markdown files (a draft runs
#   nothing until it is marked ready);
# - every Monday 02:00 Beijing time on main;
# - on demand (workflow_dispatch).
# A push to main runs the checks job only: the pull request already built and
# tested the same merge result.
#
# Native steps reuse a runner-local tool image via tools/ci/run_tools.sh.
# Only a cold/missing recipe installs packages; ESP-IDF keeps its own image.
# Native tools run as the runner user; ESP-IDF returns its root-owned files.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group so that a push to main does not cancel the
# weekly full run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The wrapper and commands are written for bash (also inside ESP-IDF).
defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  # ESP-IDF steps run as root; its work directory belongs to the runner user,
  # so Git would treat the checkout as unsafe and not find the repository.
  # Checkout trusts it only for its own commands.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
  # Peaks measured with four jobs: about 1 GiB to build native-asan, 0.7 GiB
  # to build the firmware and 0.2 GiB to run the sanitizer tests.
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  IDF_PY_BUILD_JOBS: 4

jobs:
  checks:
    name: dependency, contract, readability and format checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux]
    # A cold recipe installs the combined compiler/checker toolchain once.
    timeout-minutes: 20
    outputs:
      build: ${{ steps.scope.outputs.build }}
      tools-ready: ${{ steps.tools.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its first parent, the base.
          fetch-depth: 2
      # First after checkout, so that the builds still run when a later check
      # fails.
      - name: Decide whether to build
        id: scope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Not piped into grep -q: under pipefail, git dying of SIGPIPE
              # after an early match would read as "no code changed".
              changed=$(git diff --name-only HEAD^1 HEAD)
              if [ -n "$changed" ] && grep -qv '\.md$' <<< "$changed"; then
                build=true
              else
                build=false
              fi ;;
            push) build=false ;;
            *) build=true ;;
          esac
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
      - name: Runner resources
        run: |
          echo "CPUs: $(nproc)"
          grep -E 'MemTotal|MemAvailable|SwapTotal' /proc/meminfo
          df -h "$GITHUB_WORKSPACE"
          cat /proc/pressure/memory
          docker ps --format '{{.Names}} {{.Status}}'
      - name: Prepare cached native tools
        id: tools
        run: tools/ci/run_tools.sh prepare
      - name: CI tool runner tests
        run: tools/ci/run_tools.sh run python3 -m unittest discover -s tests/tools -p test_ci_tools.py -v
      - name: Dependency rules
        run: tools/ci/run_tools.sh run python3 tools/check_deps.py
      - name: Dependency checker tests
        run: ../../tools/ci/run_tools.sh run python3 -m unittest -v test_check_deps
        working-directory: tests/tools
      - name: Contract clauses and traceability
        run: tools/ci/run_tools.sh run python3 tools/check_contracts.py
      - name: Contract checker tests
        run: ../../tools/ci/run_tools.sh run python3 -m unittest -v test_check_contracts
        working-directory: tests/tools
      - name: Readability rules and baseline
        run: tools/ci/run_tools.sh run python3 tools/check_readability.py
      - name: Readability checker tests
        run: ../../tools/ci/run_tools.sh run python3 -m unittest -v test_check_readability
        working-directory: tests/tools
      - name: Formatting
        run: tools/ci/run_tools.sh run bash -euo pipefail -c "git ls-files '*.c' '*.cpp' '*.h' | xargs clang-format-18 --dry-run --Werror"
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  native:
    name: native ${{ matrix.compiler }} ${{ matrix.preset }}
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.build == 'true' && needs.checks.outputs.tools-ready == 'success' }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GCC native-debug: native-asan is the same GCC Debug build and
          # runs the same tests with sanitizers on top.
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-release}
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-asan}
          - {compiler: gcc, cc: gcc, cxx: g++, preset: native-tsan}
          - {compiler: clang, cc: clang, cxx: clang++, preset: native-debug}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # -g output records the build directory, and the workspace path is the
      # same in every container, so debug builds hit the cache as well.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 1G
      # Without these ccache does not cache the unit tests, which are built
      # with a precompiled header.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      # GCC 13's ThreadSanitizer may fail to start with 32 bits of mmap
      # randomization. A container shares the host's kernel and cannot change
      # it, so the runner machine sets 28 once (docs/development.md).
      - name: Check ASLR for ThreadSanitizer
        if: matrix.preset == 'native-tsan'
        run: |
          bits=$(tools/ci/run_tools.sh mmap-bits)
          if [ "$bits" -gt 28 ]; then
            echo "::error::vm.mmap_rnd_bits is $bits on the runner machine; ThreadSanitizer needs 28 (docs/development.md)"
            exit 1
          fi
      - name: Tool versions
        run: tools/ci/run_tools.sh run bash -eu -c 'cmake --version && ninja --version && ccache --version && "$CC" --version && "$CXX" --version'
      - name: Configure
        run: tools/ci/run_tools.sh run cmake --preset ${{ matrix.preset }} -DAYNI_DOWNLOAD_DIR=/downloads
      - name: Build
        run: |
          tools/ci/run_tools.sh run ccache --zero-stats
          tools/ci/run_tools.sh run cmake --build --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        run: tools/ci/run_tools.sh run ccache --show-stats
      - name: Test
        run: tools/ci/run_tools.sh run ctest --preset ${{ matrix.preset }}
      - name: Simulator
        run: tools/ci/run_tools.sh run ./build/${{ matrix.preset == 'native-debug' && 'native' || matrix.preset }}/targets/simulator/ayni-sim

  clang-tidy:
    name: clang-tidy (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cached native tools
        run: tools/ci/run_tools.sh prepare
      # Without the precompiled header, so that this weekly build also checks
      # that each test file includes what it uses.
      - name: Configure
        run: tools/ci/run_tools.sh run cmake --preset native-debug -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DAYNI_DOWNLOAD_DIR=/downloads
      - name: Build generated sources
        run: tools/ci/run_tools.sh run cmake --build --preset native-debug
      - name: clang-tidy
        run: tools/ci/run_tools.sh run run-clang-tidy-18 -j "$CMAKE_BUILD_PARALLEL_LEVEL" -p build/native -quiet 'core/|hosts/|runtime/|targets/'

  esp-idf:
    name: ESP32-S3 hello firmware (ESP-IDF v6.0.3)
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.build == 'true' }}
    runs-on: [self-hosted, linux]
    # The first run on a machine also pulls the 5.5 GB image.
    timeout-minutes: 40
    # Its own cache volume: the image's ccache is a different version from
    # Ubuntu's, and the firmware needs a smaller limit.
    container:
      image: espressif/idf:v6.0.3
      volumes:
        - ayni-ccache-esp-idf:/ccache
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # Every compile passes a specs file that each build writes anew, and
          # ccache hashes its modification time unless told to hash content.
          export CCACHE_DIR=/ccache CCACHE_MAXSIZE=200M CCACHE_COMPILERCHECK=content
          ccache --zero-stats
          cd targets/esp32_assistant
          idf.py --ccache build
          ccache --show-stats
          idf.py size
      - name: Return files to the runner's user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP/..")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME"
